name: Validate and Package V03

on:
  pull_request:
    branches:
      - develop

jobs:
  build-v03:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct V03 source applicator
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('.')
          chunks = sorted((root / '.github/v03_chunks').glob('chunk*.txt'))
          if len(chunks) != 22:
              raise RuntimeError(f'Expected 22 V03 chunks, found {len(chunks)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          script = base64.b64decode(payload)
          digest = hashlib.sha256(script).hexdigest()
          expected = '27c689d6c8438cd666c55d199713603fe7cd28fa973fb90e5929c7bea0fa31ef'
          if digest != expected:
              raise RuntimeError(f'V03 payload checksum mismatch: {digest}')
          target = root / '.github/scripts/apply_v03.py'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(script)
          '@ | python -

      - name: Apply V03 source
        run: python .github/scripts/apply_v03.py

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri:build

      - name: Prepare V03 artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "NAS VocRep Setup V03.exe" -Force

          $stage = Join-Path $env:RUNNER_TEMP "V03-source"
          New-Item $stage -ItemType Directory -Force | Out-Null
          $files = @(
            "src/App.jsx",
            "src/styles.css",
            "src/lib/audioFiles.js",
            "src-tauri/src/lib.rs",
            "package.json",
            "package-lock.json",
            "src-tauri/Cargo.toml",
            "src-tauri/tauri.conf.json",
            ".github/workflows/windows-installer.yml"
          )
          foreach ($file in $files) {
            $destination = Join-Path $stage $file
            New-Item (Split-Path $destination) -ItemType Directory -Force | Out-Null
            Copy-Item $file $destination -Force
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "NAS-VocRep-V03-Validated-Source.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-Setup-V03
          path: NAS VocRep Setup V03.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-V03-Validated-Source
          path: NAS-VocRep-V03-Validated-Source.zip
          if-no-files-found: error
