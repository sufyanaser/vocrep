name: Validate and Package V03

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-v03:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct V03 source applicator
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('.')
          chunks = sorted((root / '.github/v03_chunks').glob('chunk*.txt'))
          if len(chunks) != 22:
              raise RuntimeError(f'Expected 22 V03 chunks, found {len(chunks)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          script = base64.b64decode(payload)
          digest = hashlib.sha256(script).hexdigest()
          expected = '27c689d6c8438cd666c55d199713603fe7cd28fa973fb90e5929c7bea0fa31ef'
          if digest != expected:
              raise RuntimeError(f'V03 payload checksum mismatch: {digest}')
          target = root / '.github/scripts/apply_v03.py'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(script)
          '@ | python -

      - name: Apply V03 source
        run: python .github/scripts/apply_v03.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Windows NSIS build
        run: npm run tauri:build

      - name: Prepare installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "NAS VocRep Setup V03.exe" -Force

      - name: Commit validated V03 source
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/v03-build.yml" -Force
          Remove-Item ".github/scripts/apply_v03.py" -Force
          Remove-Item ".github/v03_chunks" -Recurse -Force
          Remove-Item ".github/v03_payload" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item ".github/v03-trigger.txt" -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete VocRep tools and release V03"
          git push origin HEAD:${{ github.head_ref }}

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-Setup-V03
          path: NAS VocRep Setup V03.exe
          if-no-files-found: error
