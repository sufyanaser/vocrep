name: Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build signed installer
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare versioned installer
        id: package
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [version]$config.version
          $label = 'V{0:D2}' -f $version.Minor
          $filename = "NAS VocRep Setup $label.exe"
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $target = Join-Path $installer.DirectoryName $filename
          Copy-Item $installer.FullName $target -Force
          "label=$label" >> $env:GITHUB_OUTPUT
          "path=$target" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-Setup-${{ steps.package.outputs.label }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
