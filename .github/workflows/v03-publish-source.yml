name: Publish Validated V03 Source

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  publish-v03-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct validated source applicator
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('.')
          chunks = sorted((root / '.github/v03_chunks').glob('chunk*.txt'))
          if len(chunks) != 22:
              raise RuntimeError(f'Expected 22 V03 chunks, found {len(chunks)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          script = base64.b64decode(payload)
          digest = hashlib.sha256(script).hexdigest()
          expected = '27c689d6c8438cd666c55d199713603fe7cd28fa973fb90e5929c7bea0fa31ef'
          if digest != expected:
              raise RuntimeError(f'V03 payload checksum mismatch: {digest}')
          target = root / '.github/scripts/apply_v03.py'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(script)
          '@ | python -

      - name: Apply already validated V03 source
        run: python .github/scripts/apply_v03.py

      - name: Publish source-only branch from develop
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "V03-publish"
          New-Item $stage -ItemType Directory -Force | Out-Null
          $files = @(
            "src/App.jsx",
            "src/styles.css",
            "src/lib/audioFiles.js",
            "src-tauri/src/lib.rs",
            "package.json",
            "package-lock.json",
            "src-tauri/Cargo.toml",
            "src-tauri/tauri.conf.json"
          )
          foreach ($file in $files) {
            $destination = Join-Path $stage $file
            New-Item (Split-Path $destination) -ItemType Directory -Force | Out-Null
            Copy-Item $file $destination -Force
          }

          git checkout -B validated-v03 origin/develop
          foreach ($file in $files) {
            $source = Join-Path $stage $file
            $parent = Split-Path $file
            if ($parent) {
              New-Item $parent -ItemType Directory -Force | Out-Null
            }
            Copy-Item $source $file -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $files
          git commit -m "feat: complete VocRep tools and release V03"
          git push origin HEAD:validated/v03 --force
