name: Apply Performance and Silent Process Patch

on:
  push:
    branches:
      - perf/silent-fast-import-final

permissions:
  contents: write

jobs:
  patch-validate-amend:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply focused Rust patch
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          command_count = text.count('Command::new(')
          if command_count != 6:
              raise SystemExit(f'Expected 6 Command::new calls, found {command_count}')
          text = text.replace('Command::new(', 'hidden_command(')

          import_line = 'use std::{fs, path::{Path, PathBuf}, process::Command};'
          helper = '''use std::{fs, path::{Path, PathBuf}, process::Command};

          #[cfg(windows)]
          use std::os::windows::process::CommandExt;

          #[cfg(windows)]
          const CREATE_NO_WINDOW: u32 = 0x08000000;

          fn hidden_command(program: &str) -> Command {
              let command = Command::new(program);

              #[cfg(windows)]
              {
                  let mut command = command;
                  command.creation_flags(CREATE_NO_WINDOW);
                  command
              }

              #[cfg(not(windows))]
              {
                  command
              }
          }'''
          if text.count(import_line) != 1:
              raise SystemExit('Unable to locate std process import')
          text = text.replace(import_line, helper, 1)

          replacements = {
              '"-hide_banner", "-nostats", "-i", path,': '"-hide_banner", "-nostdin", "-nostats", "-i", path,',
              '"-hide_banner", "-loglevel", "error", "-i", path, "-vn",': '"-hide_banner", "-nostdin", "-loglevel", "error", "-i", path, "-vn",',
              'command.args(["-hide_banner", "-loglevel", "error", "-y", "-i", path, "-vn"]);': 'command.args(["-hide_banner", "-nostdin", "-loglevel", "error", "-y", "-i", path, "-vn"]);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match for: {old}')
              text = text.replace(old, new, 1)

          pattern = re.compile(
              r'fn probe_audio_path\(path: &str\) -> Result<AudioMetadata, String> \{.*?\n\}\n\n#\[tauri::command\]\nfn probe_audio_files',
              re.S,
          )
          replacement = '''fn probe_audio_metadata(path: &str) -> Result<AudioMetadata, String> {
              let output = hidden_command("ffprobe")
                  .args([
                      "-v",
                      "error",
                      "-show_entries",
                      "format=format_name,duration,size:stream=codec_type,codec_name,codec_long_name,sample_rate,bits_per_sample,bits_per_raw_sample,channels,channel_layout,duration",
                      "-of",
                      "json",
                      path,
                  ])
                  .output()
                  .map_err(|error| format!("Unable to start FFprobe: {error}"))?;

              if !output.status.success() {
                  let message = String::from_utf8_lossy(&output.stderr).trim().to_string();
                  return Err(if message.is_empty() { "FFprobe failed".to_string() } else { message });
              }

              let payload: Value = serde_json::from_slice(&output.stdout)
                  .map_err(|error| format!("Invalid FFprobe response: {error}"))?;
              metadata_from_ffprobe(path, &payload)
          }

          fn is_processed_output(path: &str) -> bool {
              Path::new(path).components().any(|component| {
                  component
                      .as_os_str()
                      .to_string_lossy()
                      .eq_ignore_ascii_case("CUBASE_READY")
              })
          }

          fn probe_audio_path(path: &str) -> Result<AudioMetadata, String> {
              let mut metadata = probe_audio_metadata(path)?;
              if is_processed_output(path) {
                  if let Ok((integrated_lufs, true_peak_dbtp)) = analyze_loudness(path) {
                      metadata.integrated_lufs = Some(integrated_lufs);
                      metadata.true_peak_dbtp = Some(true_peak_dbtp);
                  }
              }
              Ok(metadata)
          }

          #[tauri::command]
          fn probe_audio_files'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Unable to replace probe_audio_path pipeline')

          waveform_probe = 'let metadata = probe_audio_path(path)?;'
          if text.count(waveform_probe) != 1:
              raise SystemExit('Unable to locate waveform metadata probe')
          text = text.replace(waveform_probe, 'let metadata = probe_audio_metadata(path)?;', 1)

          test_marker = '''    #[test]
              fn resolves_repair_profiles()'''
          test_block = '''    #[test]
              fn identifies_processed_output_path() {
                  assert!(is_processed_output("C:/Audio/CUBASE_READY/Song01.wav"));
                  assert!(!is_processed_output("C:/Audio/Song01.wav"));
              }

              #[test]
              fn resolves_repair_profiles()'''
          if text.count(test_marker) != 1:
              raise SystemExit('Unable to locate Rust test insertion point')
          text = text.replace(test_marker, test_block, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Replace staging commit with validated source commit
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-perf-silent-import.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --amend -m 'perf: speed imports and hide media subprocess windows'
          git push --force-with-lease origin HEAD:perf/silent-fast-import-final
