name: Validate and Package V02

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-v02:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply V02 source changes
        run: python .github/scripts/apply_v02.py

      - name: Apply lint compatibility fixes
        run: python .github/scripts/fix_v02_lint.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Windows NSIS build
        run: npm run tauri:build

      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -ne "NAS VocRep Setup V02.exe" } | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "src-tauri/target/release/bundle/nsis/NAS VocRep Setup V02.exe" -Force

      - name: Commit validated V02 source
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/v02-build.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github/workflows/v02-pr-build.yml" -Force
          Remove-Item ".github/scripts/apply_v02.py" -Force
          Remove-Item ".github/scripts/fix_v02_lint.py" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add truthful processing stages and release V02"
          git push origin HEAD:${{ github.head_ref }}

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-Setup-V02
          path: src-tauri/target/release/bundle/nsis/NAS VocRep Setup V02.exe
          if-no-files-found: error
