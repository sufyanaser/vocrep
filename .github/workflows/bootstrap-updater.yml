name: Bootstrap updater integration

on:
  push:
    branches: [feat/v04-auto-updater-release]
    paths:
      - "scripts/bootstrap_updater.py"
      - ".github/workflows/bootstrap-updater.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v04-auto-updater-release
          fetch-depth: 0
      - name: Apply updater integration
        run: python scripts/bootstrap_updater.py
      - name: Commit updater integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add signed in-app updater and release pipeline"
          git push origin HEAD:feat/v04-auto-updater-release
