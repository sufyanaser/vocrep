name: Package NAS VocRep V02 Artifacts

on:
  pull_request:
    branches:
      - v02-trigger-base

jobs:
  package-v02:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply V02 source changes
        run: python .github/scripts/apply_v02.py

      - name: Apply lint compatibility fixes
        run: python .github/scripts/fix_v02_lint.py

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri:build

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "NAS VocRep Setup V02.exe" -Force

          $stage = Join-Path $env:RUNNER_TEMP "V02-source"
          New-Item $stage -ItemType Directory -Force | Out-Null
          $files = @(
            "src/App.jsx",
            "src/styles.css",
            "package.json",
            "package-lock.json",
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml",
            ".github/workflows/windows-installer.yml"
          )
          foreach ($file in $files) {
            $destination = Join-Path $stage $file
            New-Item (Split-Path $destination) -ItemType Directory -Force | Out-Null
            Copy-Item $file $destination -Force
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "NAS-VocRep-V02-Validated-Source.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-Setup-V02
          path: NAS VocRep Setup V02.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-VocRep-V02-Validated-Source
          path: NAS-VocRep-V02-Validated-Source.zip
          if-no-files-found: error
